function workedSpans(pn,d){const n=NOVIX[pn+'|'+d],L=[];sh(pn,d).forEach(t=>{if(!absT(n,t))L.push(rS(t)+'–'+rE(t)+(t.rs||t.re?' (horario real)':'')+(t.t==='ap'?' (apertura)':t.t==='apoyo'?' (apoyo)':''));else if(n.tipo==='falla')L.push(t.s+'–'+t.e+' (con falla)');});
  (REPIX[pn+'|'+d]||[]).forEach(o=>L.push(o.s+'–'+o.e+' (reemplazo de '+tc(o.de)+')'));(EXIX[pn+'|'+d]||[]).forEach(o=>L.push(o.s+'–'+o.e+' (horas extra)'));return L.join(', ');}
function cierre(p,ym){const r={atr:0,sal:0,fer:0,ferD:0,progD:0,progH:0,trabD:0,trabH:0,ap:0,fallaH:0,fallas:0,vac:0,psg:0,lic:0,cubre:0,extra:0,libres:0,apoD:0,apoH:0};
  const apoDays={},libres={};
  monthDays(ym).forEach(d=>{if(cerrado(d))return;if(S.feriados[d]){const fw=workedHours(p.n,d);if(fw>0){r.fer+=fw;r.ferD++;}}const own=sh(p.n,d),n=NOVIX[p.n+'|'+d];let cH=0,cA=0,apA=0;
    own.forEach(t=>{const x=dT(t);
      if(t.t==='apoyo'){r.apoH+=x;apoDays[d]=1;}
      else if(t.t==='ap'){if(!absT(n,t))r.ap+=x;else apA+=x;}
      else{const xp=dur(t.s,t.e);cH+=xp;if(absT(n,t))cA+=xp;else if(t.rs||t.re){const q=realDiff(t);r.atr+=q.atr;r.sal+=q.sal;r.extra+=q.ext/60;}}});
    if(cH>0){r.progD++;r.progH+=cH;let left=cH-cA;
      if(cA>0&&n.tipo==='falla')left=cH-Math.min(cA,Math.max(0,fallaH(n)-apA));
      r.trabH+=left;if(left>0&&left>=cH/2)r.trabD++;}
    (EXIX[p.n+'|'+d]||[]).forEach(o=>{const x=dur(o.s,o.e);if(p.c==='Apoyo'){r.apoH+=x;apoDays[d]=1;}else{r.extra+=x;if(!sh(p.n,d).some(t=>t.t==='c'))libres[d]=1;}});
    (REPIX[p.n+'|'+d]||[]).forEach(o=>{const x=dur(o.s,o.e);
      if(o.pago==='apoyo'){r.apoH+=x;apoDays[d]=1;}else if(o.pago==='extra')r.extra+=x;else r.cubre+=x;
      if(p.c!=='Apoyo'&&!sh(p.n,d).some(t=>t.t==='c'))libres[d]=1;});});
  S.nov.filter(n=>n.p===p.n).forEach(n=>{if(n.tipo==='atr'){if(ymOf(n.d1)===ym)r.atr+=+n.min||0;}else if(n.tipo==='falla'){if(ymOf(n.d1)===ym){r.fallas++;r.fallaH+=fallaH(n);}}else r[n.tipo]+=novDays(n,ym);});
  r.apoD=Object.keys(apoDays).length;r.libres=Object.keys(libres).length;r.libH=Object.keys(libres).reduce((a,d)=>a+workedHours(p.n,d),0);r.antic=S.anticipos.filter(a=>a.p===p.n&&a.ym===ym).reduce((s,a)=>s+a.monto,0);r.cons=S.consumos.filter(c=>c.p===p.n&&ymOf(c.d)===ym).reduce((s,c)=>s+consCalc(c).tot,0);r.pagar=diasPagar(p,ym);return r;}
function diasPagar(p,ym){if(p.c==='Apoyo')return null;const f=ym+'-01',l=lastDay(ym),base=S.metas.base==='mes'?+l.slice(8):30;
  if((p.desde&&p.desde>l)||(p.hasta&&p.hasta<f))return 0;
  const st=p.desde&&ymOf(p.desde)===ym?+p.desde.slice(8):1,en=p.hasta&&ymOf(p.hasta)===ym?Math.min(+p.hasta.slice(8),base):base;
  let d=Math.max(0,en-st+1);S.nov.forEach(n=>{if(n.p===p.n&&(n.tipo==='psg'||n.tipo==='lic'))d-=novDays(n,ym);});return Math.max(0,d);}

/* ---------- meses cerrados: al cerrar se guarda el cierre tal como está y el mes queda de solo lectura ---------- */
const mesCerr=ym=>!!S.cerrados[ym];
const cerrMsg=ym=>ymName(ym)+' está cerrado: se puede ver, pero no cambiar. Para editarlo, reábrelo en Cierre.';
const cerrDesde=d=>Object.keys(S.cerrados).filter(ym=>ym>=ymOf(d)).sort()[0]||null;
const cerrFecha=(ym,y)=>fFH(S.cerrados[ym].fecha,y);
/* filas del cierre: las guardadas si el mes está cerrado; si no, calculadas ahora (requiere index() del mismo mes) */
function cierreFilas(ym){const z=S.cerrados[ym];if(z)return z.filas;const L=[];
  AREAS.forEach(a=>inArea(a).forEach(p=>{const q=cierre(p,ym),c=cMes(p,ym);q.saldo=c==='Apoyo'||p.vac==null?null:p.vac-vacUsed(p);if(c==='Apoyo'){q.trabD=0;q.trabH=0;q.ap=0;}
    L.push({n:p.n,a,c,cl:cLbl(p,ym),cargo:cargoOf(p),rut:p.rut||null,full:p.full||null,ingreso:p.ingreso||null,q});}));
  return L;}

/* ---------- piezas visuales ---------- */
function mm(m){return m>=60?fh(m/60)+' h':m+' min';}
function realDiff(t){const sp=span(t),near=(v,ref)=>{while(v<ref-720)v+=1440;while(v>ref+720)v-=1440;return v;};
  const ra=t.rs?near(mins(t.rs),sp[0]):sp[0],rb=t.re?near(mins(t.re),sp[1]):sp[1],di=ra-sp[0],dO=rb-sp[1];
  const ci=di>0?(['atr','just'].includes(t.ci)?t.ci:'atr'):(['ext','no'].includes(t.ci)?t.ci:'ext');
  const co=dO<0?(['sal','just'].includes(t.co)?t.co:'sal'):(['ext','no'].includes(t.co)?t.co:'ext');
  return{di,dO,ci,co,atr:di>0&&ci==='atr'?di:0,sal:dO<0&&co==='sal'?-dO:0,ext:(di<0&&ci==='ext'?-di:0)+(dO>0&&co==='ext'?dO:0)};}
function realTag(t){const q=realDiff(t),L=[];if(q.atr)L.push('Atraso '+mm(q.atr));if(q.sal)L.push('Salida anticipada '+mm(q.sal));if(q.ext)L.push(fh(q.ext/60)+' h extra');if(!L.length&&(q.di||q.dO))L.push('Justificado');return L.length?`<i class="plan rq">${L.join(', ')}</i>`:'';}
function classUI(t){const q=realDiff(t),opt=(k,L,v)=>`<select data-cl="${k}">${L.map(o=>`<option value="${o[0]}"${v===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`;let h='';
  if(q.di)h+=`<label class="cls"><span>${q.di>0?'Llegó '+mm(q.di)+' tarde':'Llegó '+mm(-q.di)+' antes'}</span>${opt('ci',q.di>0?[['atr','Atraso'],['just','Justificado, no se descuenta']]:[['ext','Horas extra'],['no','No cuenta']],q.ci)}</label>`;
  if(q.dO)h+=`<label class="cls"><span>${q.dO>0?'Salió '+mm(q.dO)+' después':'Salió '+mm(-q.dO)+' antes'}</span>${opt('co',q.dO>0?[['ext','Horas extra'],['no','No cuenta']]:[['sal','Salida anticipada'],['just','Justificado, no se descuenta']],q.co)}</label>`;
  return h?`<div class="r4">${h}</div>`:'';}
function realExtras(ym){const L=[];S.turnos.forEach(t=>{if(t.t!=='c'||ymOf(t.d)!==ym||!(t.rs||t.re)||absT(NOVIX[t.p+'|'+t.d],t))return;const q=realDiff(t);
  if(q.di<0&&q.ci==='ext')L.push({p:t.p,d:t.d,s:t.rs,e:t.s,txt:'Llegó antes de su turno'});if(q.dO>0&&q.co==='ext')L.push({p:t.p,d:t.d,s:t.e,e:t.re,txt:'Se quedó después de su turno'});});return L;}
const rS=t=>t.rs||t.s,rE=t=>t.re||t.e,dT=t=>dur(rS(t),rE(t));
function chip(t){const cls=t.t==='apoyo'?'k-apoyo':'k-'+kind(t.s)+(t.t==='ap'?' ap':'');
  if(t.rs||t.re)return `<span class="chip ${cls} real"><b>${rS(t)}–${rE(t)}</b><i>${fh(dT(t))} h reales${t.t==='ap'?', apertura':''}</i><i class="plan">Planificado ${t.s}–${t.e}</i>${t.t==='c'?realTag(t):''}</span>`;
  return `<span class="chip ${cls}"><b>${t.s}–${t.e}</b><i>${fh(dur(t.s,t.e))} h${t.t==='ap'?', apertura':t.t==='apoyo'?', apoyo':''}</i></span>`;}
function chipAbs(t,n){const rs=((n.reps||{})[t.id]||[]).filter(r=>r.p);
  return `<span class="chip abs"><b>${t.s}–${t.e}</b><i>${rs.length?'Reemplazo: '+esc(rs.map(r=>tc(r.p)).join(' y ')):'Sin reemplazo'}</i></span>`;}
function chipOff(t){return `<span class="chip abs"><b>${t.s}–${t.e}</b><i>No se trabajó</i></span>`;}
function chipExt(x){return `<span class="chip ext"><b>${x.s}–${x.e}</b><i>${fh(dur(x.s,x.e))} h extra${x.m?': '+esc(x.m):''}</i></span>`;}
function chipRep(o){return `<span class="chip rep"><b>${o.s}–${o.e}</b><i>Cubre a ${esc(tc(o.de))}, ${PAGO[o.pago]}</i></span>`;}
function cellBtn(p,d){if(!active(p,d.iso)&&!sh(p.n,d.iso).length&&!REPIX[p.n+'|'+d.iso]&&!EXIX[p.n+'|'+d.iso])return null;
  const own=sh(p.n,d.iso),n=NOVIX[p.n+'|'+d.iso],reps=REPIX[p.n+'|'+d.iso]||[];
  const cz=cerrado(d.iso);let c='';if(cz&&(own.length||reps.length))c+='<span class="tag t-fer">Feriado, no se trabajó</span>';if(n)c+=`<span class="tag t-${n.tipo}">${TIPOS[n.tipo]}</span>`;
  own.forEach(t=>{c+=cz?chipOff(t):absT(n,t)?chipAbs(t,n):chip(t);});reps.forEach(o=>{if(!cz)c+=chipRep(o);});(EXIX[p.n+'|'+d.iso]||[]).forEach(x=>{c+=chipExt(x);});
  if(!c)c='<span class="libre">Libre</span>';
  const lbl=tc(p.n)+', '+flong(d.iso)+': '+(n?TIPOS[n.tipo]+'. ':'')+(own.length?own.map(t=>t.s+' a '+t.e).join(' y '):(reps.length?'':'libre'))+(reps.length?' Cubre a '+reps.map(o=>tc(o.de)).join(' y '):'');
  return `<button class="cell" data-act="ed" data-p="${esc(p.n)}" data-d="${d.iso}" aria-label="${esc(lbl)}">${c}</button>`;}
function td(p,d){if(!d.inMonth)return '<td class="out"></td>';const b=cellBtn(p,d);return b?`<td>${b}</td>`:'<td class="out" title="Fuera de su periodo de trabajo"></td>';}
function meter(st,p){if(p&&p.c==='Apoyo')return `<div class="meter"><div class="row"><span class="h">${fh(st.h)} h</span><span class="m">${st.nd} días</span></div><span class="msg">Apoyo, sin horario fijo</span></div>`;
  return `<div class="meter st-${st.cls}"><div class="row"><span class="h">${fh(st.h)} h</span><span class="m">${esc(st.meta)}</span></div><div class="track"><span style="width:${st.pct}%"></span></div><span class="msg">${esc(st.txt)}</span>${st.ap?`<span class="apx">+${fh(st.ap)} h de apertura</span>`:''}</div>`;}
function whoCell(p,st){const extra=p.hasta&&ymOf(p.hasta)===ui.mes?`<span class="apx">Hasta el ${+p.hasta.slice(8)}</span>`:(p.desde&&ymOf(p.desde)===ui.mes?`<span class="apx">Desde el ${+p.desde.slice(8)}</span>`:'');
  return `<th class="who" scope="row"><button class="nm" data-act="persona" data-p="${esc(p.n)}">${esc(tc(p.n))}</button><button class="badge${st.c==='?'?' q':''}" data-act="contrato" data-p="${esc(p.n)}" title="Cambiar tipo de contrato">${CLBL[st.c]}</button>${extra}${meter(st,p)}</th>`;}

function coverage(area,w){const list=[];
  w.days.forEach(d=>{if(!d.inMonth||cerrado(d.iso))return;
    S.personas.forEach(p=>{if(p.a!==area)return;sh(p.n,d.iso).forEach(t=>{if(!absT(NOVIX[p.n+'|'+d.iso],t))list.push({d:d.iso,sp:span(t)});});});
    REPS.forEach(o=>{if(o.d===d.iso&&o.a===area)list.push({d:d.iso,sp:span(o)});});});
  if(!list.length)return '';
  const lo=Math.floor(Math.min(...list.map(x=>x.sp[0]))/60),hi=Math.ceil(Math.max(...list.map(x=>x.sp[1]))/60),N=hi-lo;let mx=1;
  const per={};w.days.forEach(d=>{const c=[];for(let i=0;i<N;i++){const mid=(lo+i)*60+30;c.push(list.filter(x=>x.d===d.iso&&x.sp[0]<=mid&&x.sp[1]>mid).length);}per[d.iso]=c;c.forEach(v=>{if(v>mx)mx=v;});});
  const hh=h=>pad(h%24);
  let html=`<tr class="cov"><th class="who" scope="row"><b>Personas por hora</b>De ${hh(lo)}:00 a ${hh(hi)}:00</th>`;
  w.days.forEach(d=>{if(!d.inMonth){html+='<td class="out"></td>';return;}
    const c=per[d.iso],own=list.filter(x=>x.d===d.iso);
    if(!own.length){html+=`<td><span class="libre">${cerrado(d.iso)?'Cerrado':'Sin turnos'}</span></td>`;return;}
    const a=Math.min(...own.map(x=>x.sp[0])),b=Math.max(...own.map(x=>x.sp[1])),gaps=[];
    let svg=`<svg viewBox="0 0 ${N*6} 40" preserveAspectRatio="none" role="img" aria-label="Personas por hora el ${flong(d.iso)}">`;
    c.forEach((v,i)=>{const x=i*6;
      if(v===0&&(lo+i)*60+30>=a&&(lo+i)*60+30<b){gaps.push(hh(lo+i)+':00');svg+=`<rect class="z" x="${x}" y="34" width="5" height="6"><title>${hh(lo+i)}:00 sin nadie</title></rect>`;}
      else if(v>0){const h=Math.max(3,v/mx*38);svg+=`<rect class="b" x="${x}" y="${40-h}" width="5" height="${h}"><title>${hh(lo+i)}:00, ${v} ${v===1?'persona':'personas'}</title></rect>`;}});
    html+=`<td>${svg}</svg><div class="ax"><span>${hh(lo)}</span><span>${hh(hi)}</span></div>${gaps.length?`<div class="alert">Sin nadie: ${gaps[0]}${gaps.length>1?' (+'+(gaps.length-1)+' h)':''}</div>`:''}</td>`;});
  return html+'</tr>';}

/* ---------- vistas ---------- */
function vSemana(){const W=weeksOf(ui.mes);if(ui.sem>W.length)ui.sem=1;const w=W[ui.sem-1],areas=ui.area==='Todas'?AREAS:[ui.area];
  if(narrow())return vSemanaMovil(w,areas);
  let h=`<div class="scroll"><table class="grid"><thead><tr><th class="who">${ui.area==='Todas'?'Todo el personal':ui.area}</th>`;
  w.days.forEach(d=>{const fe=S.feriados[d.iso];h+=`<th class="${d.iso===TODAY?'hoy':''}" scope="col">${d.inMonth?`<button class="dh" data-act="fer" data-d="${d.iso}" title="${fe?'Feriado: '+esc(fe.n):'Marcar como feriado'}">`:''}${DIAS[d.dow]}<span class="dn">${d.day}</span>${fe?`<span class="fer${fe.cerrado?' off':''}">${esc(fe.n)}${fe.cerrado?', cerrado':''}</span>`:''}${d.inMonth?'</button>':''}</th>`;});
  h+='</tr></thead><tbody>';
  areas.forEach(a=>{if(areas.length>1)h+=`<tr class="grp"><th colspan="8">${a}</th></tr>`;
    inArea(a).forEach(p=>{h+=`<tr class="${isVac(p.n)?'vac':''}">${whoCell(p,stats(p,w))}`;w.days.forEach(d=>{h+=td(p,d);});h+='</tr>';});
    if(areas.length===1)h+=coverage(a,w);});
  h+=`</tbody></table></div><div class="below"><div class="legend"><span class="chip k-dia">Entra antes de 14:00</span><span class="chip k-tarde">14:00 a 19:00</span><span class="chip k-noche">Desde 19:00</span><span class="chip ap">Apertura</span><span class="chip rep">Reemplazo</span><span class="chip k-apoyo">Apoyo</span><span class="chip ext">Horas extra</span><span><span class="vacm"></span>Vacante</span></div>
  <div class="acts"><button class="btn" data-act="extnew">Registrar horas extra</button><button class="btn" data-act="nuevo">Agregar trabajador</button><button class="btn" data-act="copiar">Copiar la semana anterior en esta</button></div></div>`;
  const NM=S.notasMes[ui.mes]||{};areas.forEach(a=>{h+=NM[a]?`<p class="nota"><b>Nota de ${a}:</b> ${esc(NM[a])} <button class="btn sm" data-act="nota" data-a="${a}">Editar</button></p>`:(areas.length===1?`<p class="nota"><button class="btn sm" data-act="nota" data-a="${a}">Agregar nota de ${a} para este mes</button></p>`:'');});
  return h;}

function vResumen(){const m=S.metas,W=weeksOf(ui.mes);
  let h=`<div class="metas"><label>Full time 5 días<input type="number" step="0.5" data-meta="f5" value="${m.f5}"></label><label>Full time 6 días<input type="number" step="0.5" data-meta="f6" value="${m.f6}"></label><label>Part time máximo<input type="number" step="0.5" data-meta="pt" value="${m.pt}"></label></div>`;
  h+='<div class="scroll"><table class="mes"><thead><tr><th>Trabajador</th><th>Contrato</th>';

  h+='<th>Contrato mes</th><th>Aperturas</th><th>Total</th></tr></thead><tbody>';
  AREAS.forEach(a=>{h+=`<tr class="grp"><th colspan="${W.length+5}" style="text-align:left">${a}</th></tr>`;
    inArea(a).forEach(p=>{let tot=0,ap=0;h+=`<tr><td class="n">${esc(tc(p.n))}</td><td>${cLbl(p,ui.mes)}</td>`;

const CCOLS=[['pagar','Días a pagar'],['trabD','Días trabajados'],['trabH','Horas trabajadas'],['ap','Aperturas (h)'],['fallaH','Fallas (h a descontar)'],['atr','Atrasos (min)'],['sal','Salidas anticipadas (min)'],['vac','Vacaciones (días)'],['saldo','Saldo vacaciones'],['psg','Permiso sin goce (días)'],['lic','Licencia (días)'],['cubre','Cubrió turnos (h)'],['extra','Horas extra'],['libres','Días libres trabajados'],['libH','Días libres trabajados (h)'],['ferD','Feriados trabajados (días)'],['fer','Feriados trabajados (h)'],['apoD','Apoyo (días)'],['apoH','Apoyo (h)'],['antic','Anticipo ($)'],['cons','Consumo ($)']];
function vCierre(){const ym=ui.mes,z=S.cerrados[ym],base=z?z.base:S.metas.base;
  let h=z?`<div class="banner"><span><b>Mes cerrado</b> el ${cerrFecha(ym)}. Estas cifras quedaron guardadas y el mes no se puede cambiar.</span><button class="btn" data-act="reabrir">Reabrir mes</button></div>`
    :`<div class="metas"><label>Días base de la liquidación<select data-meta2="base"><option value="30"${S.metas.base!=='mes'?' selected':''}>30 días siempre</option><option value="mes"${S.metas.base==='mes'?' selected':''}>Días del mes (28 a 31)</option></select></label><button class="btn cerrb" data-act="cerrar">Cerrar ${MESES[+ym.slice(5,7)-1]}</button></div>`+revision(ym);
  h+=`<div class="scroll"><table class="cierre"><thead><tr><th>Trabajador</th><th>Contrato</th>${CCOLS.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>`;
  const FI=cierreFilas(ym);
  AREAS.forEach(a=>{h+=`<tr class="grp"><th colspan="${CCOLS.length+2}">${a}</th></tr>`;
    FI.filter(f=>f.a===a).forEach(f=>{const r=f.q;
      h+=`<tr><td class="n"><button class="nm" data-act="persona" data-p="${esc(f.n)}">${esc(tc(f.n))}</button></td><td>${esc(f.cl)}</td>`;
      CCOLS.forEach(([k])=>{let v=r[k],cls='';
        if(k==='saldo'){h+=f.c==='Apoyo'?'<td class="z">–</td>':(v==null?'<td class="z" title="Falta ingresar días disponibles">–</td>':`<td class="${v<0?'neg':''}">${fh(v)}</td>`);return;}
        if((k==='pagar')||(k==='trabH'&&f.c==='Part')||(f.c==='Apoyo'&&(k==='apoH'||k==='apoD')))cls='k';
        h+=v?`<td class="${cls}">${fh(v)}</td>`:'<td class="z">–</td>';});
      h+='</tr>';});});

/* mes cerrado que tocaría guardar el diálogo abierto (null si ninguno) */
function edBloq(){const m=ed.mode,L=[],add=d=>{if(d)L.push(ymOf(d));};
  const orig=(A,k)=>{const o=F.id&&A.find(x=>x.id===F.id);if(o)add(o[k]);};
  if(m==='turno')add(ed.d);
  else if(m==='nov'){range(F.d1,F.d2).forEach(add);const o=F.id&&S.nov.find(n=>n.id===F.id);if(o)range(o.d1,o.d2).forEach(add);}
  else if(m==='swap'||m==='fer'||m==='ext')add(F.d);
  else if(m==='nota')L.push(ui.mes);
  else if(m==='ant'){orig(S.anticipos,'fecha');add(F.fecha);}
  else if(m==='cons'){orig(S.consumos,'d');add(F.d);}
  else if(m==='baja'&&F.sal)L.push(cerrDesde(F.sal));
  else if(m==='asignar'&&F.desde)L.push(cerrDesde(addD(F.desde,-1)));
  else if(m==='persona'&&F.orig&&F.c!==F.c0&&F.cdesde)L.push(cerrDesde(F.cdesde));
  return L.find(ym=>ym&&mesCerr(ym))||null;}
/* aviso si el diálogo es de un día o registro de un mes cerrado: se muestra sin poder cambiarlo */
function edSoloLect(){const m=ed.mode;let ym=null;
  if(['turno','nov','swap','fer','nota'].includes(m))ym=edBloq();
  else if((m==='ant'||m==='cons')&&F.id){const o=(m==='ant'?S.anticipos:S.consumos).find(x=>x.id===F.id),d=o&&(m==='ant'?o.fecha:o.d);if(d&&mesCerr(ymOf(d)))ym=ymOf(d);}
  return ym?cerrMsg(ym):'';}

function openNov(p,tipo,d,existing){if(existing){F=JSON.parse(JSON.stringify(existing));F.horas=F.horas==null?'':F.horas;F.dias=F.dias==null?'':F.dias;F.reps=F.reps||{};}
  else F={p,tipo,d1:d,d2:d,horas:'',dias:'',min:'',reps:{}};F.err='';openD('nov');}

  if(a==='respdl'){backupDl();return;}

const XW=(()=>{
  const enc=new TextEncoder();
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

  const CL=n=>{let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
  const xe=s=>String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function zip(files){const parts=[],cd=[];let off=0;
    files.forEach(f=>{const nm=enc.encode(f.name),d=enc.encode(f.data),c=crc32(d);
      const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);

/* la clave va siempre dentro del mensaje (POST), nunca en la dirección. Si el script es de una versión anterior y no sabe leer por POST
   (responde "datos incompletos"), se lee como antes por GET y se avisa que hay que actualizarlo */
function api(method,body){const post=b=>fetch(CONF.url,{method:'POST',body:JSON.stringify(Object.assign({key:CONF.key},b))}).then(r=>r.json());
  if(method!=='GET')return post(body);
  return post({accion:'leer'}).then(r=>{if(!r||r.error!=='datos incompletos'){window.__scriptViejo=false;return r;}
    window.__scriptViejo=true;const sep=CONF.url.includes('?')?'&':'?';
    return fetch(CONF.url+sep+'key='+encodeURIComponent(CONF.key)+'&t='+Date.now()).then(x=>x.json());});}

  S.personas.forEach(p=>{if(!('desde' in p))p.desde=null;if(!('hasta' in p))p.hasta=null;if(!('vac' in p))p.vac=null;});
  S.turnos.forEach((t,i)=>{if(!t.id)t.id='t'+i;});normReps();
  if(!S.meses.includes(ui.mes))ui.mes=S.meses.includes(ymOf(TODAY))?ymOf(TODAY):S.meses[S.meses.length-1];ui.sem=semHoy();}
function checkDraft(){try{const dr=JSON.parse(localStorage.getItem(DKEY)||'null');
  if(dr&&dr.base===S.guardado&&dr.data){if(JSON.stringify(dr.data)!==snapshot()){restore(dr.data);dirty=true;window.__draftMsg=true;}}
  else if(dr)localStorage.removeItem(DKEY);}catch(e){}}
function loadServer(){if(!CONF||!CONF.url){render();openConn();return;}loading=true;render();
  api('GET').then(r=>{loading=false;
      if(!r.ok){render();if(r.error==='clave'){toast('La clave no es correcta.');openConn();}else toast('No se pudieron leer los datos.');return;}
      if(r.estado){applyState(r.estado);try{localStorage.setItem(CACHEK,JSON.stringify(r.estado));}catch(e){}window.__vacio=false;}else window.__vacio=true;
      checkDraft();render();})
    .catch(()=>{loading=false;try{const c=JSON.parse(localStorage.getItem(CACHEK)||'null');if(c)applyState(c);}catch(e){}checkDraft();render();toast('Sin conexión: estás viendo lo último guardado en este equipo.');});}
function openConn(){F={url:CONF&&CONF.url||'',key:CONF&&CONF.key||'',err:''};openD('conn');}
loadServer();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('beforeunload',e=>{if(dirty)e.preventDefault();});
})();
</script>
